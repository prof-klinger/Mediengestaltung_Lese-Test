<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesetest &ndash; Gemeinsame Stoppuhr</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main>
  <header>
    <h1>Lesetest</h1>
    <p class="hint">Eine Stoppuhr f&uuml;r alle. Wer stoppt, legt eine Runde ab &ndash; die Uhr l&auml;uft weiter.</p>
  </header>

  <section class="clock" id="clock" aria-live="polite">00:00,0</section>

  <section class="controls">
    <button id="btn-start" class="btn primary">Start</button>
    <button id="btn-stop" class="btn" disabled>Stopp</button>
    <button id="btn-reset" class="btn ghost">Zur&uuml;cksetzen</button>
  </section>

  <section class="laps">
    <h2>Runden</h2>
    <ol id="lap-list" class="lap-list"></ol>
    <p id="lap-empty" class="empty">Noch keine Runden.</p>
  </section>

  <p id="status" class="status"></p>
</main>
</body>
</html>
