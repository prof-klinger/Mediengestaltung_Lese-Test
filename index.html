<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesetest &ndash; Gemeinsame Stoppuhr</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body data-page="participant">
<main>
  <header>
    <h1>Lesetest</h1>
    <p class="hint">Dr&uuml;cke <strong>Stopp</strong>, wenn du fertig gelesen hast. Deine Zeit wird als Runde gespeichert.</p>
  </header>

  <section class="clock" id="clock" aria-live="polite">00:00,0</section>

  <section class="controls">
    <button id="btn-stop" class="btn primary" disabled>Stopp</button>
  </section>

  <p id="status" class="status"></p>

  <section class="laps">
    <h2>Runden</h2>
    <ol id="lap-list" class="lap-list"></ol>
    <p id="lap-empty" class="empty">Noch keine Runden.</p>
  </section>
</main>
</body>
</html>
